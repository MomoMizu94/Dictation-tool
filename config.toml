# Dictation daemon configuration.
# Copy to config.local.toml to override

[model]
# Multilingual weights; [transcribe].language pins us to English.
name = "large-v3-turbo"

# "cuda" or "cpu". The daemon logs which one it actually ended up on.
device = "cuda"

# float16 on GPU; use "int8" when device = "cpu", or "int8_float16" if VRAM is tight.
compute_type = "float16"

[audio]
# Keep these at 16000 Hz and mono since no resampling.
# PipeWire provides this format directly based on testing
sample_rate = 16000
channels = 1
blocksize = 1024

# Empty string = system default input device. Otherwise a sounddevice index or a name
# substring, e.g. "Scarlett"
device = ""

# Refuse to transcribe clips shorter than this; guards against key-bounce
min_duration_s = 0.3

# Stop the microphone and transcribe at this limit even if the release was missed
max_duration_s = 120.0

[transcribe]
language = "en"
beam_size = 5
# Trims leading/trailing silence. Cuts latency and suppresses hallucinated text
# on near-silent clips
vad_filter = true
# Keep sentence style across audio chunks within one recording
# Separate recordings never share transcript text
# Set false if long, noisy recordings produce repeated phrases
condition_on_previous_text = true
# Whisper imitates example text rather than following editing instructions
# Empty string disables this punctuation and capitalization hint
initial_prompt = "Hello. The meeting starts at nine. Please bring your notes. Are you ready? Yes, let's begin."
# Add a final period when the transcript ends in a letter or digit, before quotes
# Disable when dictating fragments that should remain open-ended
ensure_final_period = true

[daemon]
# Unix socket the client connects to. $XDG_RUNTIME_DIR is expanded
socket_path = "$XDG_RUNTIME_DIR/dictation.sock"

[output]
# Pipe the transcript to wl-copy
clipboard = true
# Desktop notifications through the system Python D-Bus helper
notifications = true
# Characters of the transcript to show in the completion notification. 0 = no preview.
preview_chars = 80
